
- type: entity
  parent: WeaponTurretVespera
  id: WeaponTurretVesperaFlare
  name: ADMP-F-27 SEREN Rapid-Fire Pod
  description: A model of the ADMP-27, fitted to fire thermal flares instead of rockets. Distracts missiles and other heat-seeking projectiles with intense thermal signatures. Has a delay after the last shot before they start recharging. Can be remotely activated or linked to a GCS.
  components:
  - type: Sprite
    sprite: _Mono/Objects/ShuttleWeapons/vespera.rsi
    layers:
    - state: space_artillery_flare
  - type: StaticPrice
    price: 2800
  - type: Battery
    maxCharge: 6000
    startingCharge: 6000
  - type: Gun
    fireRate: 4.6
    shootThermalSignature: 1400000 # ~1.2km if firing continuously
    projectileSpeed: 32
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rocket_launcher.ogg
      params:
        pitch: 1.35
        variation: 0.1
    soundEmpty:
      path: /Audio/Weapons/click.ogg
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 320
    autoRechargePause: true
    autoRechargePauseTime: 45
  - type: ProjectileBatteryAmmoProvider
    proto: ShipThermalFlare
    fireCost: 475
  - type: RadarBlip
    radarColor: "#F77816"
    scale: 2
  - type: ShipGunClass
    shipClass: Light # it's a flare launcher

- type: entity
  id: ShipThermalFlare
  name: thermal flare
  description: A relatively large and very-hot-burning flare, meant to attract heat-seeking projectiles.
  components:
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      flare:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 32
        friction: 0.1
        mask:
        - ItemMask
  - type: Sprite
    sprite: Objects/Misc/flare.rsi
    layers:
      - map: [ enum.ExpendableLightVisualLayers.Glow ]
        state: flare_burn
        color: "#FFFFFF"
        shader: unshaded
        offset: -0.5,-0.5
        scale: 2,2
  - type: Item
    size: Large
  - type: MultiHandedItem
  - type: TimedDespawn
    lifetime: 25
  - type: TargetSeekable
  - type: ThermalSignature
    storedHeat: 2000 # 750 metres, without any heat dissipated
    heatDissipation: 0.8
  - type: PassiveThermalSignature
    signature: 1200 # 150 metres
  - type: AmbientSound
    volume: -8
    range: 25
    sound:
      path: /Audio/Items/Flare/flare_burn.ogg
  - type: PointLight
    color: "#FF7700"
    radius: 6.0
    energy: 12.0
  - type: RadarBlip
    shape: Hexagon
    scale: 1.25
    maxDistance: 768
    radarColor: '#FFA600'
    highlightedRadarColor: '#FF7700'
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]